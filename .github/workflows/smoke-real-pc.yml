name: Smoke (real process-compose)

# Real-binary smoke (issue #60). Complements `ci.yml`'s stub-based suite by
# running the canonical agent surface against the actual `process-compose`
# binary, so behaviour only the real binary exhibits — probe convergence, OS
# port binding, hot-reload — is exercised in CI.
#
# Gating:
#   - Triggers on any PR that changes non-test source under `src/`. The
#     smoke drives the BUILT CLI, so every production module is in its blast
#     radius; a hand-kept list of modules went stale (health, selection,
#     bounded-*, reaper, ... were missing, so refactors of them skipped the
#     real binary until the nightly run, issue #264). Test-only and docs-only
#     PRs don't pay the cost.
#   - Nightly cron catches process-compose-side regressions without blocking
#     every PR.
#   - Does NOT run on every push to `main` — pinned releases land via PR.
on:
  pull_request:
    paths:
      # GitHub evaluates `paths` in order and a later pattern overrides an
      # earlier one, so the order below is load-bearing:
      #   1. any file under src/ triggers (every production module);
      #   2. test files and the shared test setup are carved back out, since a
      #      change there cannot alter what the built CLI does;
      #   3. the smoke suite itself is re-included, because editing it must
      #      run it even though it matches the test carve-out in (2).
      - "src/**"
      - "!src/**/*.test.ts"
      - "!src/test-setup.ts"
      - "src/real-pc.smoke.test.ts"
      # Non-source triggers: the bundler config (a bundling regression broke
      # the artifact once, issue #65/#66), the agent-surface fixtures the
      # smoke drives, and this workflow.
      - "test/fixtures/agent-surface/**"
      - "vite.config.ts"
      - ".github/workflows/smoke-real-pc.yml"
  schedule:
    # Nightly at 06:00 UTC (off-peak for both US and EU contributors).
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: smoke-real-pc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: real-pc smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Vite+ (Node + package manager + cache)
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true

      - name: Install dependencies
        run: vp install

      # ----------------------------------------------------------------------
      # Install process-compose at a PINNED version. Bumping the pin is an
      # explicit ritual (the smoke test is the canary for process-compose-
      # side behaviour changes — if a new release renames a field or changes
      # probe semantics, this workflow is where we want to see the red).
      # ----------------------------------------------------------------------
      - name: Install process-compose (pinned)
        env:
          # Pinned so a process-compose release that changes the agent surface
          # surfaces as a red check here, not silently in production. Bump
          # deliberately; the smoke test is the canary. This is also devtrees' minimum
          # supported version (issue #173), so CI exercises the floor.
          PC_VERSION: v1.122.0
        run: |
          set -euo pipefail
          # Download the release tarball directly so the install script's
          # version-resolution behaviour isn't on the critical path. Linux x86-64
          # binary lives at the same path on every release.
          mkdir -p "$HOME/.local/bin"
          TARBALL="process-compose_linux_amd64.tar.gz"
          URL="https://github.com/F1bonacc1/process-compose/releases/download/${PC_VERSION}/${TARBALL}"
          curl -fsSL "$URL" -o "/tmp/${TARBALL}"
          tar -xzf "/tmp/${TARBALL}" -C "$HOME/.local/bin" process-compose
          chmod +x "$HOME/.local/bin/process-compose"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/process-compose" version

      # devtrees CLI is bundled to dist/cli.mjs — the smoke spawns it as a
      # subprocess, so the test depends on `vp run build` having run first.
      - name: Build devtrees CLI
        run: vp run build

      # Scenario 133 boots the published devtrees@0.4.0. It is installed here,
      # from a cache when possible and with retries otherwise, so an npm
      # registry hiccup cannot fail the smoke. A registry that stays down
      # fails this step after the retries, and the test itself fails (never
      # skips) in CI when the CLI is missing.
      - name: Cache devtrees@0.4.0 (scenario 133)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/devtrees-0.4.0
          key: devtrees-legacy-0.4.0-v1

      - name: Install devtrees@0.4.0 (scenario 133)
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/devtrees-0.4.0"
          cli="$dir/node_modules/devtrees/dist/cli.mjs"
          if [ ! -f "$cli" ]; then
            for attempt in 1 2 3 4 5; do
              if npm install --loglevel=error --no-save --no-audit --no-fund --prefer-offline \
                --prefix "$dir" devtrees@0.4.0; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::could not install devtrees@0.4.0 from npm after 5 attempts"
                exit 1
              fi
              echo "::warning::npm install devtrees@0.4.0 failed (attempt $attempt); retrying"
              sleep $((attempt * 10))
            done
          fi
          test -f "$cli"
          echo "DEVTREES_LEGACY_CLI=$cli" >> "$GITHUB_ENV"

      - name: Run real-pc smoke
        env:
          DEVTREES_REAL_PC_E2E: "1"
        run: vp test run real-pc.smoke
